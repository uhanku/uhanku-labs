services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uhanku_labs}
      MYSQL_USER: ${MYSQL_USER:-uhanku}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-uhanku}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ul-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${MYSQL_USER:-uhanku}:${MYSQL_PASSWORD:-uhanku}@mysql:3306/${MYSQL_DATABASE:-uhanku_labs}
      MEDIA_ADMIN_USERNAME: ${MEDIA_ADMIN_USERNAME:-}
      MEDIA_ADMIN_PASSWORD_HASH: ${MEDIA_ADMIN_PASSWORD_HASH:-}
      MEDIA_SESSION_SECRET: ${MEDIA_SESSION_SECRET:-}
      MEDIA_STORAGE_DIR: /app/storage/media
      MEDIA_UPLOAD_TEMP_DIR: /app/storage/media-uploads
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-52428800}
      MEDIA_UPLOAD_CHUNK_BYTES: ${MEDIA_UPLOAD_CHUNK_BYTES:-5242880}
      MEDIA_UPLOAD_TEMP_MAX_AGE_MS: ${MEDIA_UPLOAD_TEMP_MAX_AGE_MS:-86400000}
    volumes:
      - .:/app
      - ul-node_modules:/app/node_modules
      - ul-next-dev:/app/.next
      - ul-storage-dev:/app/storage
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy

  labs:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-uhanku}:${MYSQL_PASSWORD:-uhanku}@mysql:3306/${MYSQL_DATABASE:-uhanku_labs}
      MEDIA_ADMIN_USERNAME: ${MEDIA_ADMIN_USERNAME:-}
      MEDIA_ADMIN_PASSWORD_HASH: ${MEDIA_ADMIN_PASSWORD_HASH:-}
      MEDIA_SESSION_SECRET: ${MEDIA_SESSION_SECRET:-}
      MEDIA_STORAGE_DIR: /app/storage/media
      MEDIA_UPLOAD_TEMP_DIR: /app/storage/media-uploads
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-52428800}
      MEDIA_UPLOAD_CHUNK_BYTES: ${MEDIA_UPLOAD_CHUNK_BYTES:-5242880}
      MEDIA_UPLOAD_TEMP_MAX_AGE_MS: ${MEDIA_UPLOAD_TEMP_MAX_AGE_MS:-86400000}
    volumes:
      - .:/app
      - ul-storage-prod:/app/storage
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy

  open-webui:
    build:
      context: .
      dockerfile: docker/openwebui.Dockerfile
    restart: unless-stopped
    environment:
      WEBUI_NAME: "u-chat"
      WEBUI_URL: ${OPENWEBUI_WEBUI_URL:-http://chat.uhanku.test}
      CORS_ALLOW_ORIGIN: ${OPENWEBUI_CORS_ALLOW_ORIGIN:-http://chat.uhanku.test}

      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}

      OPENAI_API_BASE_URLS: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEYS: ${OPENROUTER_API_KEY:-}

      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "3"
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>

      # Code Interpreter
      ENABLE_CODE_EXECUTION: "true"
      CODE_EXECUTION_ENGINE: "pyodide"
      ENABLE_CODE_INTERPRETER: "true"
      CODE_INTERPRETER_ENGINE: "pyodide"
      # Optional, makes /mnt/uploads survive browser reloads
      ENABLE_PYODIDE_FILE_PERSISTENCE: "true"
    volumes:
      - ul-open-webui:/app/backend/data
    expose:
      - "8080"
    depends_on:
      - searxng

  file-export-server:
    image: ghcr.io/glissemantv/owui-file-export-server:latest
    restart: unless-stopped
    environment:
      FILE_EXPORT_DIR: /output
    volumes:
      - ul-generated-files:/output
    expose:
      - "9003"

  file-generator:
    image: ghcr.io/glissemantv/file-gen-sse-http:latest
    restart: unless-stopped
    environment:
      MODE: http
      FILE_EXPORT_DIR: /output
      FILE_EXPORT_BASE_URL: ${GENERATED_FILES_BASE_URL:-http://chat.uhanku.test/generated-files}
      PERSISTENT_FILES: "true"
      FILES_DELAY: "60"
      LOG_LEVEL: "INFO"
      OWUI_URL: http://open-webui:8080
    volumes:
      - ul-generated-files:/output
    expose:
      - "9004"
    depends_on:
      - file-export-server
      - open-webui

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
    volumes:
      - ./docker/searxng:/etc/searxng
      - ul-searxng-cache:/var/cache/searxng
    expose:
      - "8080"

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    restart: unless-stopped
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?CRAWL4AI_API_TOKEN must be set}
      # Extraction LLM via OpenRouter (LiteLLM: model=openrouter/<id>)
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter/liquid/lfm-2.5-2.6b:free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      # Compatibility: allow openai/provider path with OpenRouter endpoint
      OPENAI_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_BASE_URL: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_BASE_URL: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
    expose:
      - "11235"
    shm_size: "1gb"
    user: "appuser"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 512
        reservations:
          memory: 1G

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "${NGINX_CONFIG:-./docker/nginx/dev/nginx.conf}:/etc/nginx/conf.d/default.conf:ro"

  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    volumes:
      - ./.hermes:/opt/data
    ports:
      - "127.0.0.1:8642:8642"
      - "0.0.0.0:9119:9119"
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_USERNAME}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_PASSWORD}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_AUTH_SECRET}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY}"
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  ul-mysql:
  ul-node_modules:
  ul-next-dev:
  ul-storage-dev:
  ul-storage-prod:
  ul-open-webui:
  ul-searxng-cache:
  ul-generated-files:
