services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uhanku_labs}
      MYSQL_USER: ${MYSQL_USER:-uhanku}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-uhanku}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ul-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${MYSQL_USER:-uhanku}:${MYSQL_PASSWORD:-uhanku}@mysql:3306/${MYSQL_DATABASE:-uhanku_labs}
      MEDIA_ADMIN_USERNAME: ${MEDIA_ADMIN_USERNAME:-}
      MEDIA_ADMIN_PASSWORD_HASH: ${MEDIA_ADMIN_PASSWORD_HASH:-}
      MEDIA_SESSION_SECRET: ${MEDIA_SESSION_SECRET:-}
      MEDIA_STORAGE_DIR: /app/storage/media
      MEDIA_UPLOAD_TEMP_DIR: /app/storage/media-uploads
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-52428800}
      MEDIA_UPLOAD_CHUNK_BYTES: ${MEDIA_UPLOAD_CHUNK_BYTES:-5242880}
      MEDIA_UPLOAD_TEMP_MAX_AGE_MS: ${MEDIA_UPLOAD_TEMP_MAX_AGE_MS:-86400000}
    volumes:
      - .:/app
      - ul-node_modules:/app/node_modules
      - ul-next-dev:/app/.next
      - ul-storage-dev:/app/storage
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy

  labs:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-uhanku}:${MYSQL_PASSWORD:-uhanku}@mysql:3306/${MYSQL_DATABASE:-uhanku_labs}
      MEDIA_ADMIN_USERNAME: ${MEDIA_ADMIN_USERNAME:-}
      MEDIA_ADMIN_PASSWORD_HASH: ${MEDIA_ADMIN_PASSWORD_HASH:-}
      MEDIA_SESSION_SECRET: ${MEDIA_SESSION_SECRET:-}
      MEDIA_STORAGE_DIR: /app/storage/media
      MEDIA_UPLOAD_TEMP_DIR: /app/storage/media-uploads
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-52428800}
      MEDIA_UPLOAD_CHUNK_BYTES: ${MEDIA_UPLOAD_CHUNK_BYTES:-5242880}
      MEDIA_UPLOAD_TEMP_MAX_AGE_MS: ${MEDIA_UPLOAD_TEMP_MAX_AGE_MS:-86400000}
    volumes:
      - ul-storage-prod:/app/storage
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui
    restart: unless-stopped
    environment:
      WEBUI_NAME: "u-chat"
      WEBUI_URL: ${OPENWEBUI_WEBUI_URL:-http://chat.uhanku.test}
      CORS_ALLOW_ORIGIN: ${OPENWEBUI_CORS_ALLOW_ORIGIN:-http://chat.uhanku.test}
      OPENAI_API_BASE_URLS: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEYS: ${OPENROUTER_API_KEY:-}
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "3"
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
    volumes:
      - ul-open-webui:/app/backend/data
    expose:
      - "8080"
    depends_on:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
    volumes:
      - ./docker/searxng:/etc/searxng
      - ul-searxng-cache:/var/cache/searxng
    expose:
      - "8080"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "${NGINX_CONFIG:-./docker/nginx/dev/nginx.conf}:/etc/nginx/conf.d/default.conf:ro"

volumes:
  ul-mysql:
  ul-node_modules:
  ul-next-dev:
  ul-storage-dev:
  ul-storage-prod:
  ul-open-webui:
  ul-searxng-cache:
