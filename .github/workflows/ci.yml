name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: uhanku_labs_test
          MYSQL_USER: uhanku
          MYSQL_PASSWORD: uhanku
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://uhanku:uhanku@127.0.0.1:3306/uhanku_labs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:test
      - run: npm run lint
      - run: npm run build

  deploy-production:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: uhanku-labs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull main on production server
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          PORT="${DEPLOY_PORT:-22}"

          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "cat@$DEPLOY_HOST" \
            'cd /home/cat/uhanku-labs && git pull --ff-only origin main'

      - name: Deploy production service
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -eu
          PORT="${DEPLOY_PORT:-22}"
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "cat@$DEPLOY_HOST" \
            'cd /home/cat/uhanku-labs && ./scripts/deploy-prod.sh'
